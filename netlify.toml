[build]
  command = "npm run build"
  publish = "_site"
  functions = "netlify/functions"

[dev]
  command = "npm start"
  port = 8888
  targetPort = 8080
  framework = "#custom"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"